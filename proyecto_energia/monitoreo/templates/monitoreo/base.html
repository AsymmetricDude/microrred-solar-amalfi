{% load static %}<!doctype html>
<html lang="es-CO" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Microrred Solar ZNI · Amalfi{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  {# Versiones fijadas (OT-0006): Tailwind Play CDN, Chart.js, Lucide y Alpine.js. #}
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] } } } };
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  {% block scripts %}{% endblock %}
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script>
    // Sin depender de ningún CDN: si una librería externa no cargó (sin internet, CDN caído), se
    // dice en pantalla en vez de dejar una página rota en silencio. Estilos en línea a propósito:
    // Tailwind puede ser justamente lo que falta.
    window.addEventListener("load", () => {
      const faltan = ["tailwind", "Chart", "lucide", "Alpine"].filter((nombre) => !window[nombre]);
      if (!faltan.length) return;
      const aviso = document.createElement("div");
      aviso.setAttribute("role", "alert");
      aviso.style.cssText =
        "position:sticky;top:0;z-index:50;padding:12px 16px;background:#fef2f2;color:#991b1b;" +
        "border-bottom:1px solid #fecaca;font:14px system-ui,sans-serif";
      aviso.textContent =
        "No se pudieron cargar librerías externas (" + faltan.join(", ") +
        "). Revisa la conexión a internet y recarga la página.";
      document.body.prepend(aviso);
    });
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .tabular { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="h-full bg-slate-50 font-sans text-slate-900 antialiased">
  {% block cuerpo %}{% endblock %}
</body>
</html>
